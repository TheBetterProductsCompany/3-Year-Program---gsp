const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const DAYNAMES=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
const TOTAL_WEEKS=29;
const PHASES=[
  {n:'FOUNDATION',wks:[1,8],desc:'Groove the patterns. 65-73%.'},
  {n:'BUILD',wks:[9,16],desc:'Load + explode. 68-77%.'},
  {n:'CONVERSION',wks:[17,24],desc:'Strength → violence. 72-82%.'},
  {n:'PEAK',wks:[25,29],desc:'Peak power. Express + test. 76-88%.'},
];
function getPhase(w){return PHASES.find(p=>w>=p.wks[0]&&w<=p.wks[1])||PHASES[PHASES.length-1];}
function getPhaseNum(w){return PHASES.findIndex(p=>w>=p.wks[0]&&w<=p.wks[1])+1;}
function E(name,detail,note){return{name,detail,note:note||''};}
function weekInCycle(w){return ((w-1)%4)+1;}
function isReset(w){return weekInCycle(w)===4;}
function isPeak(w){return weekInCycle(w)===3;}
function r5(n){return Math.round(n/5)*5;}
function wavePct(w){const c=Math.ceil(w/4);const base=65+(c-1)*3;const wic=weekInCycle(w);if(wic===1)return base;if(wic===2)return base+4;if(wic===3)return base+8;return 58;}
// Power days (Mon/Tue/Wed) = heavier %, lower reps. Volume days (Thu/Fri/Sat) = -8%, higher reps.
function dayIsPower(d){return d<=2;}
function pctFor(w,d){return wavePct(w)+(dayIsPower(d)?5:-3);}
function wtD(rm,w,d){return r5(rm*pctFor(w,d)/100);}
function repsFor(d){return dayIsPower(d)?'5×3':'4×8';}
function repsSecFor(d){return dayIsPower(d)?'4×4':'4×8';}
function focusLabel(w){const wic=weekInCycle(w);if(wic===1)return'BUILD';if(wic===2)return'PROGRESS';if(wic===3)return'PEAK';return'DELOAD';}
const RM={bsquat:285,front:235,bench:300,sgdl:300,snatch:150,clean:205,cossack:140,slrdl:55,row:235,pull:55,chin:65,dip:120,stepup:135,arnold:58,oarow:60};
function Ld(name,rm,w,d,note){return E(name,repsFor(d)+' @ '+wtD(rm,w,d)+' lbs',note||'');}
function Ls(name,rm,w,d,note){return E(name,repsSecFor(d)+' @ '+wtD(rm,w,d)+' lbs',note||'');}

// ═══ AM: CARDIO (fixed by user) + plyo/core on Tue/Thu/Sat ═══
function amBlock(w,d){
  const cardio=[
    E('Run — 6×400m','2min rest','Threshold. Just run — attack it.'),
    E('Row — 8×250m','90s rest','+ plyo + core below.'),
    E('Run — 5×1km','Z2-Z3','Aerobic power. Just run.'),
    E('Row — 5×1km','Z2','+ plyo + core below.'),
    E('Run — 5km','steady Z2','Just run. Negative split.'),
    E('Skipping — 15 min','continuous','Calf springs. + plyo + core below.'),
    E('Recovery','—','')
  ][d];
  if(d===6)return[cardio];
  // Tue/Thu/Sat get plyo + core circuit after cardio
  if(d===1)return[cardio,
    E('PLYO: Jump Lunges + Knee→Box Jumps','4×6 each + 4×3','Explosive. Soft, athletic landings.'),
    E('CORE: Copenhagens / Steamrollers / Sit-up Ball Throw','3 rounds, 40s ea','Anti-lateral → anti-frag → dynamic.')];
  if(d===3)return[cardio,
    E('PLYO: Lateral Bounds + DB Pogos','4×5 each + 3×20','Frontal spring + ankle stiffness.'),
    E('CORE: Side Plank Leg Raise / Reverse Crab / Squeeze Ball','3 rounds','Anti-lateral → extension → rotation.')];
  if(d===5)return[cardio,
    E('PLYO: Box Jumps + Jump Lunges','4×3 + 4×6 each','Vertical + knee-dominant RFD.'),
    E('CORE: SLBHK / Steamrollers / Med Ball Slam','3 rounds','Glute+anti-rot → anti-frag → power.')];

  return [cardio, E('AM = Run only','—','No plyo/core — save it for the row/skip days.')];
}

// ═══ PM WEIGHTS: GORILLA (Mon/Thu) · PANTHER (Tue/Fri) · SNAKE (Wed/Sat) ═══
function getWeights(w,d){
  const pw=dayIsPower(d);
  // GORILLA — max bilateral strength
  if(d===0||d===3)return{title:'🦍 GORILLA — MAX STRENGTH',main:[
    Ld('Back Squat',RM.bsquat,w,d,pw?'POWER. Explode up.':'VOLUME. Full depth, tempo.'),
    Ld('Flat Bench',RM.bench,w,d,'Horizontal push.'),
    Ls('Pendlay Row',RM.row,w,d,'Horizontal pull. Dead stop.'),
    LdHinge(w,d),
    E('SUPERSET: Weighted Dips + Pull-ups/Chin-ups',repsSecFor(d)+' @ +'+wtD(RM.dip,w,d)+' / '+repsSecFor(d)+' @ +'+wtD(w%2?RM.pull:RM.chin,w,d)+' lbs','Push+pull back-to-back, rest after the pair. Alt grip weekly.')
  ].concat(calvesFor(d))};
  // PANTHER — unilateral / lateral / single-leg
  if(d===1||d===4)return{title:'🐆 PANTHER — UNILATERAL',main:[
    Ls('BB Step-up → Reverse Lunge',RM.stepup,w,d,'R first +1 set. Weight transfer.'),
    E('DB Walking Lunges',repsSecFor(d)+' each','Unilateral quad. Long stride.'),
    Ls('Cossack Squat',RM.cossack,w,d,'R first. Adductors + depth.'),
    E('SL-RDL',repsSecFor(d)+' each @ '+RM.slrdl+' DB','Unilateral hinge + balance.'),
    E('One-Arm DB Row',repsSecFor(d)+' each @ '+RM.oarow+' lbs','Unilateral pull. Anti-rotation.'),
    E('SLBHK','3×12 each','Glute activation.')
  ].concat(calvesFor(d))};
  // SNAKE — rotation / olympic / skill / explosive
  return{title:'🐍 SNAKE — ROTATION + OLYMPIC',main:[
    isPeak(w)?E('Snatch','work to heavy '+(pw?'triple':'double')+' ~'+wtD(RM.snatch,w,d),'POWER. Technical — form breaks = max.'):E('Snatch',(pw?'5×3':'6×2')+' @ '+wtD(RM.snatch,w,d)+' lbs',pw?'Full extension. Technical.':'Speed + position. Never grind.'),
    isPeak(w)?E('Power Clean','heavy '+(pw?'double':'triple')+' ~'+wtD(RM.clean,w,d),'Violent hips.'):E('Power Clean',(pw?'5×3':'6×2')+' @ '+wtD(RM.clean,w,d)+' lbs',pw?'Triple extension.':'Speed. Never grind.'),
    Ls('Front Squat',RM.front,w,d,'Supports the lifts. Quad focus, upright.'),
    E('Cable Chops + Squeeze Ball Rotation','3×8 ea + 3×10','Rotation connector. Slow eccentric.'),
    E('Lateral Ball Throw + Med Ball Slam','4×5 ea + 4×5','Rotational velocity + power.'),
    E('TGU + Handstands','3×3 ea + 10 min','Full-body control + overhead skill.')
  ].concat(calvesFor(d))};
}
// Gorilla hinge rotates Mon (snatch-grip DL heavy) vs Thu (lighter, for spinal recovery)
function calvesFor(d){return (d===1||d===3||d===5)?[E('Calves + Tibs','4×15 + 3×20','Weak calves — full ROM, 1s pause. Tue/Thu/Sat only.')]:[];}
function LdHinge(w,d){
  if(d===0)return Ls('Snatch-Grip Deadlift',RM.sgdl,w,d,'Bilateral hinge. Heavy pull — Monday, fresh.');
  return E('SL-RDL',repsSecFor(d)+' each @ '+RM.slrdl+' DB','Lighter hinge — Thursday spares the spine after Wed.');
}

function getMobility(w,d){
  const ph=getPhaseNum(w);const hold=ph===1?'45s':ph===2?'60s':ph>=3?'75s':'60s';
  if(d===6)return{title:'RECOVERY',focus:'Off',duration:'40 min',options:[E('Cold Plunge','5-10 min',''),E('Free Movement Flow','15 min','Play, every joint.'),E('Reverse Crab + Deep Squat Sit','10 min','Anterior open + hip.')]};
  return{title:'MOBILITY + SPLITS',focus:'Daily 8-10 min',duration:'8-10 min',options:[
    E('Splits (forward + lateral)','3×'+hold+' each','DAILY. ~1cm/week. Warm only.'),
    E('Hip 90/90 + T-Spine Opener','2min ea + 10 ea','Internal rotation + thoracic.'),

}

}

  if(method==='POST')opts.headers['Prefer']='resolution=merge-duplicates,return=representation';

function updateClock(){
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Toronto'}));
  const h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0'),s=String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent=h+':'+m+':'+s;
  const dn=['SUN','MON','TUE','WED','THU','FRI','SAT'][now.getDay()];
  const mn=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][now.getMonth()];
  document.getElementById('dateDisp').textContent=dn+' '+String(now.getDate()).padStart(2,'0')+' - '+mn+' - '+now.getFullYear();
}

function calcCurrentWeek(){
  // Progress-based: land on the furthest week you've actually completed, on your next unfinished day.
  const comp=getCompletions();let anyDone=false,maxWeek=1,maxDay=0;
  const pfx=PROG_VER+'_';
  for(const key in comp){
    if(!comp[key])continue;
    if(key.indexOf(pfx)!==0)continue;  // ignore old-program completions
    anyDone=true;
    const parts=key.slice(pfx.length).split('_');const wk=parseInt(parts[0]),dy=parseInt(parts[1]);
    if(wk>maxWeek){maxWeek=wk;maxDay=dy;}else if(wk===maxWeek&&dy>maxDay){maxDay=dy;}
  }
  if(!anyDone)return{week:1,day:0};
  // training days are Mon-Sat (0-5). If all 6 done, advance to next week.
  const allDone=[0,1,2,3,4,5].every(d=>comp[pfx+maxWeek+'_'+d]);
  if(allDone&&maxWeek<52)return{week:maxWeek+1,day:0};
  // otherwise stay on current week, land on first unfinished day
  for(let d=0;d<6;d++){if(!comp[pfx+maxWeek+'_'+d])return{week:maxWeek,day:d};}
  return{week:maxWeek,day:maxDay};
}

function exHTML(ex,section,idx){
  const eid=`${curWeek}_${curDay}_${section}_${idx}`;const parsed=parseExercise(ex.detail,ex.name);const numSets=parsed.sets;const logged=getSetLog(eid);const targetWt=calcTarget(ex.name,parsed.pct,ex.detail);
  const isTimeBased=isTimeExercise(ex.name,ex.detail);const isCarry=/farmer|carry|carries/i.test(ex.name);
  const allSaved=numSets>0&&Object.keys(logged).length>=numSets&&Object.values(logged).every(v=>v&&v.saved);
  const doneCls=(_exDone[eid]||allSaved)?' done':'';
  let h=`<div class="ex${doneCls}" onclick="toggleEx(this,event)" data-eid="${eid}"><div class="ex-dot" onclick="toggleExDone('${eid}',event)"></div><div class="ex-body"><div class="ex-name">${ex.name}</div><div class="ex-detail">${ex.detail}</div>`;
  if(ex.note)h+=`<div class="ex-note">${ex.note}</div>`;
  if(numSets>0){
    h+=`<div class="ex-toggle">TAP TO LOG</div><div class="ex-sets" onclick="event.stopPropagation()">`;
    if(isTimeBased){
      h+=`<div class="sets-hdr" style="grid-template-columns:36px 1fr 1fr 1fr 1fr 40px"><span>SET</span><span>TARGET</span><span>TIME</span><span>DIST</span><span>PACE</span><span class="sh-c">SAVE</span></div>`;
      for(let s=1;s<=numSets;s++){const sv=logged[s]||{};const isSaved=sv.saved;
        h+=`<div class="set-row" id="sr_${eid}_${s}" style="grid-template-columns:36px 1fr 1fr 1fr 1fr 40px"><div class="set-label">S${s}</div><div class="set-target-wt" style="font-size:9px">—</div><input class="set-input" type="text" inputmode="text" placeholder="0:00" value="${sv.wt||''}" oninput="cacheSet('${eid}',${s},'wt',this.value)" onfocus="this.select()"><input class="set-input" type="text" inputmode="text" placeholder="meters" value="${sv.reps||''}" oninput="cacheSet('${eid}',${s},'reps',this.value)" onfocus="this.select()"><div class="pct-badge neutral" style="font-size:9px">${calcPace(sv.wt,sv.reps)}</div><button class="set-confirm${isSaved?' saved':''}" onclick="confirmSet('${eid}',${s},this)">${isSaved?'✓':'↑'}</button></div>`}
    }else{
      h+=`<div class="sets-hdr"><span>SET</span><span>TARGET</span><span>WEIGHT</span><span>REPS</span><span class="sh-c">%</span><span class="sh-c">SAVE</span></div>`;
      for(let s=1;s<=numSets;s++){const sv=logged[s]||{};const setTarget=targetWt?Math.round(targetWt):0;const setReps=parsed.repScheme[s-1]||parsed.reps||'';const actualWt=sv.wt?parseFloat(sv.wt):0;const isSaved=sv.saved;
        let pctClass='neutral',pctText='—';if(setTarget>0&&actualWt>0){const pv=Math.round((actualWt/setTarget)*100);pctText=pv+'%';pctClass=pv>=100?'hit':pv>=90?'neutral':'miss'}
        h+=`<div class="set-row" id="sr_${eid}_${s}"><div class="set-label">S${s}</div><div class="set-target-wt">${setTarget>0?setTarget+'<span style="font-size:8px;opacity:.5;margin-left:2px">lbs</span>':'—'}</div><input class="set-input" type="number" inputmode="decimal" placeholder="${setTarget>0?setTarget:'lbs'}" value="${sv.wt||''}" data-eid="${eid}" data-set="${s}" data-target="${setTarget}" oninput="cacheSet('${eid}',${s},'wt',this.value);updatePctBadge(this)" onfocus="this.select()"><input class="set-input" type="number" inputmode="numeric" placeholder="${setReps||'reps'}" value="${sv.reps||''}" oninput="cacheSet('${eid}',${s},'reps',this.value)" onfocus="this.select()"><div class="pct-badge ${pctClass}" data-eid="${eid}" data-set="${s}">${pctText}</div><button class="set-confirm${isSaved?' saved':''}" onclick="confirmSet('${eid}',${s},this)">${isSaved?'✓':'↑'}</button></div>`}
    }
    h+=`</div>`}
  h+=`</div></div>`;return h;
}

function isTimeExercise(name,detail){
  const n=name.toLowerCase(),d=(detail||'').toLowerCase();
  if(/pendlay/i.test(n))return false;if(/farmer/i.test(n))return false;
  if(/\brow\b|rower|rowing|easy row/i.test(n))return true;if(/\brun\b|running/i.test(n))return true;if(/ski\s*erg/i.test(n))return true;
  if(/\b400m\b|\b2000m\b|\b100m\b/i.test(n))return true;if(/\bsled\b/i.test(n))return true;if(/\bsprint/i.test(n))return true;
  if(/\d+\s*[x×]\s*\d+\s*min/i.test(d))return true;return false;
}

function calcPace(timeStr,distStr){
  if(!timeStr||!distStr)return'—';let totalSec=0;const cm=String(timeStr).match(/(\d+):(\d+)/);
  if(cm)totalSec=parseInt(cm[1])*60+parseInt(cm[2]);else{const n=parseFloat(timeStr);totalSec=n>10?n:n*60}
  const dist=parseFloat(distStr);if(!totalSec||!dist||dist===0)return'—';
  const p=totalSec/dist*500;return Math.floor(p/60)+':'+String(Math.round(p%60)).padStart(2,'0')+'/500m';
}

function toggleEx(el,e){if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.classList.contains('pct-badge'))return;el.classList.toggle('open')}

function parseExercise(detail,name){
  if(!detail)return{sets:0,reps:0,pct:0,repScheme:[]};const d=detail;
  let m=d.match(/(\d+)\s*[x×]\s*(\d+)\s*@\s*[+]?(\d+)\s*lbs/i);if(m)return{sets:parseInt(m[1]),reps:parseInt(m[2]),pct:0,repScheme:Array(parseInt(m[1])).fill(parseInt(m[2])),fixedWt:parseInt(m[3])};
  m=d.match(/(\d+)\s*[x×]\s*(\d+)/i);if(m){const pm=d.match(/(\d+)%/);return{sets:parseInt(m[1]),reps:parseInt(m[2]),pct:pm?parseInt(pm[1]):0,repScheme:Array(parseInt(m[1])).fill(parseInt(m[2]))}};
  if(/work to/i.test(d))return{sets:6,reps:1,pct:0,repScheme:[1,1,1,1,1,1]};
  m=d.match(/(\d+)\s*attempt/i);if(m)return{sets:parseInt(m[1]),reps:1,pct:0,repScheme:Array(parseInt(m[1])).fill(1)};
  if(/^\d+\s*min/i.test(d))return{sets:1,reps:0,pct:0,repScheme:[0],isConditioning:true};
  m=d.match(/(\d+)\s*[x×]\s*(\d+)\s*(min|m\b)/i);if(m)return{sets:parseInt(m[1]),reps:0,pct:0,repScheme:Array(parseInt(m[1])).fill(0),isConditioning:true};
  m=d.match(/^(\d+)\s*[x×]/i);if(m)return{sets:parseInt(m[1]),reps:0,pct:0,repScheme:Array(parseInt(m[1])).fill(0)};
  return{sets:0,reps:0,pct:0,repScheme:[]};
}

function calcTarget(exName,pct,detail){
  if(detail){let m=detail.match(/@\s*\+?(\d+)(?:\s*lbs)?/);if(m)return parseInt(m[1]);m=detail.match(/(\d+)\s*[x×]\s*\d+\s*@\s*(\d+)/);if(m&&!/%/.test(detail))return parseInt(m[2])}
  return 0;
}

function updatePctBadge(input){
  const eid=input.dataset.eid,setNum=input.dataset.set,target=parseFloat(input.dataset.target),actual=parseFloat(input.value);
  const badge=document.querySelector(`.pct-badge[data-eid="${eid}"][data-set="${setNum}"]`);if(!badge)return;
  if(target>0&&actual>0){const pv=Math.round((actual/target)*100);badge.textContent=pv+'%';badge.className='pct-badge '+(pv>=100?'hit':pv>=90?'neutral':'miss')}else{badge.textContent='—';badge.className='pct-badge neutral'}
}

function getNutTargets(){const pn=getPhaseNum(curWeek);if(pn<=2)return{cal:3500,p:220,c:420,f:90};if(pn===3)return{cal:3700,p:230,c:450,f:95};if(pn===4)return{cal:3600,p:225,c:435,f:90};return{cal:3300,p:215,c:390,f:85}}
let _nutChecks={},_nutOverrides={},_suppChecks={};
function getNutKey(){const now=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Toronto'}));return now.toISOString().slice(0,10)}
function toggleMealCheck(mealId,btn){const key=getNutKey()+'_'+mealId;_nutChecks[key]=!_nutChecks[key];save('nutChecks',_nutChecks);btn.classList.toggle('done',_nutChecks[key]);updateNutSummary();sb(`nutrition_checks?check_key=eq.${encodeURIComponent(key)}`,'PATCH',{checked:_nutChecks[key]}).then(res=>{if(!res||res.length===0)sb('nutrition_checks','POST',{check_key:key,checked:_nutChecks[key]})})}
function toggleSuppCheck(idx,btn){const key=getNutKey()+'_supp_'+idx;_suppChecks[key]=!_suppChecks[key];save('suppChecks',_suppChecks);btn.classList.toggle('done',_suppChecks[key]);sb(`nutrition_checks?check_key=eq.${encodeURIComponent(key)}`,'PATCH',{checked:_suppChecks[key]}).then(res=>{if(!res||res.length===0)sb('nutrition_checks','POST',{check_key:key,checked:_suppChecks[key]})})}
function toggleMealBlock(el){el.closest('.meal-block').classList.toggle('open')}
function showOverride(mealId){const el=document.getElementById('ov_'+mealId);if(el)el.classList.toggle('show')}
function saveOverride(mealId){const p=parseFloat(document.getElementById('ov_p_'+mealId).value)||0,c=parseFloat(document.getElementById('ov_c_'+mealId).value)||0,f=parseFloat(document.getElementById('ov_f_'+mealId).value)||0;_nutOverrides[getNutKey()+'_'+mealId]={p,c,f};save('nutOverrides',_nutOverrides);updateNutSummary()}
function getMealMacros(meal){const key=getNutKey()+'_'+meal.id;return _nutOverrides[key]||meal.macros}
function updateNutSummary(){const targets=getNutTargets();let totP=0,totC=0,totF=0;const today=getNutKey();MEALS.forEach(m=>{if(_nutChecks[today+'_'+m.id]){const mac=getMealMacros(m);totP+=mac.p;totC+=mac.c;totF+=mac.f}});const totCal=totP*4+totC*4+totF*9;
  const setBar=(id,val,target)=>{const el=document.getElementById(id);if(!el)return;const pct=Math.min(Math.round(val/target*100),150);el.querySelector('.nut-macro-val').textContent=val;el.querySelector('.nut-macro-target').textContent='/ '+target;const fill=el.querySelector('.nut-macro-fill');fill.style.width=Math.min(pct,100)+'%';fill.className='nut-macro-fill '+(pct>=90&&pct<=110?'on-track':pct>110?'over':'under')};
  setBar('nm-cal',totCal,targets.cal);setBar('nm-p',totP,targets.p);setBar('nm-c',totC,targets.c);setBar('nm-f',totF,targets.f)}

function renderNutrition(){
  const p=document.getElementById('p-nutrition');const targets=getNutTargets();const today=getNutKey();const pn=getPhaseNum(curWeek);
  let h=`<div class="nut-hero"><div class="nut-hero-title">DAILY NUTRITION</div><div class="nut-hero-sub">Phase ${pn} — Target: ${targets.cal} cal / ${targets.p}P / ${targets.c}C / ${targets.f}F</div></div>`;
  h+=`<div class="nut-summary">`;['cal','p','c','f'].forEach(k=>{const label=k==='cal'?'CALORIES':k==='p'?'PROTEIN':k==='c'?'CARBS':'FAT';h+=`<div class="nut-macro" id="nm-${k}"><div class="nut-macro-label">${label}</div><div class="nut-macro-val">0</div><div class="nut-macro-target">/ ${targets[k]}</div><div class="nut-macro-bar"><div class="nut-macro-fill under" style="width:0%"></div></div></div>`});h+=`</div>`;
  MEALS.forEach(m=>{const key=today+'_'+m.id;const checked=_nutChecks[key];const mac=getMealMacros(m);const cal=mac.p*4+mac.c*4+mac.f*9;const ov=_nutOverrides[key];
    h+=`<div class="meal-block${checked?' open':''}"><div class="meal-header" onclick="toggleMealBlock(this)"><div class="meal-time">${m.time}</div><div class="meal-name">${m.name}</div><div class="meal-macros-preview">${mac.p}P ${mac.c}C ${mac.f}F · ${cal} cal</div><button class="meal-confirm${checked?' done':''}" onclick="event.stopPropagation();toggleMealCheck('${m.id}',this)">${checked?'✓':''}</button></div><div class="meal-body"><div class="meal-items">${m.items}</div><div class="meal-why">${m.why}</div>`;
    if(m.locked)h+=`<div class="meal-locked">FIXED PROTOCOL</div>`;else{h+=`<div class="meal-override"><button class="meal-override-btn" onclick="showOverride('${m.id}')">OVERRIDE MACROS</button><div class="meal-override-inputs${ov?' show':''}" id="ov_${m.id}"><div><div class="meal-ov-label">PROTEIN</div><input class="meal-ov-input" type="number" id="ov_p_${m.id}" placeholder="${m.macros.p}" value="${ov?ov.p:''}" onchange="saveOverride('${m.id}')"></div><div><div class="meal-ov-label">CARBS</div><input class="meal-ov-input" type="number" id="ov_c_${m.id}" placeholder="${m.macros.c}" value="${ov?ov.c:''}" onchange="saveOverride('${m.id}')"></div><div><div class="meal-ov-label">FAT</div><input class="meal-ov-input" type="number" id="ov_f_${m.id}" placeholder="${m.macros.f}" value="${ov?ov.f:''}" onchange="saveOverride('${m.id}')"></div></div></div>`}
    h+=`</div></div>`});
  h+=`<div class="supp-block"><div class="supp-title">DAILY SUPPLEMENTS</div>`;SUPPS.forEach((s,i)=>{const skey=today+'_supp_'+i;const sdone=_suppChecks[skey];h+=`<div class="supp-row"><div class="supp-time">${s.time}</div><div class="supp-name">${s.name}</div><div class="supp-why">${s.why}</div><button class="supp-check${sdone?' done':''}" onclick="toggleSuppCheck(${i},this)">✓</button></div>`});h+=`</div>`;

}

function renderPlan(){const p=document.getElementById('p-plan');let h='';PHASES.forEach((ph,pi)=>{h+=`<div style="margin-bottom:28px"><div class="ph-title">Phase ${pi+1} — ${ph.n}</div><div class="ph-desc">${ph.desc}</div>`;for(let w=ph.wks[0];w<=ph.wks[1];w++){const isCur=w===curWeek;const allDone=[0,1,2,3,4,5,6].every(d=>isComplete(w,d));h+=`<div class="pw-row${isCur?' cur':''}" onclick="curWeek=${w};curDay=0;nav('today')"><div class="pw-num">Week ${w}</div><div class="pw-focus">${ph.n}</div><div class="pw-status">${allDone?'✓ COMPLETE':isCur?'CURRENT':'—'}</div></div>`}h+=`</div>`});p.innerHTML=h}

function addPR(){const sel=document.getElementById('prSelect'),wt=document.getElementById('prWeight');if(sel&&wt&&wt.value){setPR(sel.value,parseInt(wt.value));renderPRs();renderStats()}}

function renderAll(){const phase=getPhase(curWeek);document.getElementById('phaseTag').textContent=`Phase ${getPhaseNum(curWeek)} · Week ${curWeek}`;document.getElementById('weekLbl').textContent=`Week ${curWeek} / 29`;renderDayTabs();renderWorkout();renderPlan();renderStats();renderNutrition();renderPRs()}
